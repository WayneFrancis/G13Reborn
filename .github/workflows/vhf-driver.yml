name: Experimental VHF driver build (no installation)
on:
  push:
    paths:
      - '.github/workflows/vhf-driver.yml'
      - 'drivers/G13RebornVhid/**'
  pull_request:
    paths:
      - '.github/workflows/vhf-driver.yml'
      - 'drivers/G13RebornVhid/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-driver:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore cached WDK and SDK packages
        uses: actions/cache/restore@v4
        id: wdk-cache
        with:
          path: drivers/G13RebornVhid/packages
          key: windows-2025-wdk-28000.2526-v1
      - name: Restore pinned official WDK and SDK NuGet packages
        shell: pwsh
        run: |
          nuget restore drivers/G13RebornVhid/packages.config -PackagesDirectory drivers/G13RebornVhid/packages -NonInteractive
      - name: Cache restored WDK before attempting compilation
        if: steps.wdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: drivers/G13RebornVhid/packages
          key: windows-2025-wdk-28000.2526-v1
      - name: Compile native WDK driver binary (no INF packaging)
        shell: pwsh
        run: |
          $project = 'drivers/G13RebornVhid/G13RebornVhid.vcxproj'
          msbuild $project /m /v:minimal /p:Configuration=Release /p:Platform=x64 /p:DriverTargetPlatform=Desktop /p:SignMode=Off /p:RunCodeAnalysis=false
          if ($LASTEXITCODE -ne 0) { throw "WDK native build failed: $LASTEXITCODE" }
      - name: Verify kernel driver binary was compiled
        shell: pwsh
        run: |
          $files = @(Get-ChildItem drivers/G13RebornVhid -Recurse -Filter G13RebornVhid.sys -File)
          if ($files.Count -eq 0) { throw "No .sys output was produced" }
          $files | Select-Object FullName,Length | Format-Table -AutoSize
          Write-Host "Driver compiled; no signing, installation, or kernel execution performed."
      - name: Restore official x86 WDK tools for Inf2Cat discovery
        shell: pwsh
        run: |
          # Inf2Cat may be distributed as an x86 host tool even for x64 drivers.
          # Install only into the temporary CI NuGet packages directory;
          # this does not modify Windows, install drivers, or change the x64 native build.
          nuget install Microsoft.Windows.WDK.x86 -Version 10.0.28000.2526 -OutputDirectory drivers/G13RebornVhid/packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "x86 WDK NuGet restore failed: $LASTEXITCODE" }
          $tools = @(Get-ChildItem drivers/G13RebornVhid/packages -Filter inf2cat.exe -File -Recurse -ErrorAction SilentlyContinue)
          if ($tools.Count -gt 0) {
            $tools | Select-Object -ExpandProperty FullName
          } else {
            Write-Warning "Official x86 WDK NuGet package also has no Inf2Cat.exe; signability remains UNVERIFIED."
          }
      - name: Stage unsigned package and run available WDK validation tools
        shell: pwsh
        run: |
          ./drivers/G13RebornVhid/Validate-Package.ps1 -OutputDirectory "$env:RUNNER_TEMP/G13Reborn-Vhf-Package-Check"
